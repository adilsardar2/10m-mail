
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>10m-mail is live</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #1e3c72, #2a5298);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .mail-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 50px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-align: center;
        }

        h1 {
            font-weight: 600;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .email, .timer {
            font-weight: 300;
            font-size: 1.2em;
            margin: 10px 0;
        }

        .button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: #ffffff22;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .button:hover {
            background: #ffffff55;
        }
    </style>
</head>
<body>
    <div class="mail-box">
        <h1>10m-mail is live</h1>
        <p class="email">Email: <strong>example@10m-mail.com</strong></p>
        <p class="timer">Expires in: <span id="countdown">600</span> seconds</p>
        <button class="button" onclick="location.reload()">Refresh</button>
    </div>

    <script>
        let seconds = 600;
        const countdownEl = document.getElementById("countdown");
        setInterval(() => {
            if (seconds > 0) {
                seconds--;
                countdownEl.textContent = seconds;
            }
        }, 1000);
    </script>
</body>
</html>
