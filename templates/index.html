
<!DOCTYPE html>
<html>
<head>
    <title>10m-mail is live</title>
    <style>
        body {
            font-family: sans-serif;
            background: linear-gradient(to bottom right, #2c3e50, #3498db);
            color: white;
            text-align: center;
            margin-top: 100px;
        }
        .container {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            margin: auto;
        }
        .email {
            font-weight: bold;
        }
        button {
            padding: 10px;
            margin-top: 10px;
            background: #e94560;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>10m-mail is live</h1>
        <p>Email: <span class="email">{{ email }}</span></p>
        <p>Expires in: <span id="timer">{{ expiry }}</span> seconds</p>
        <button onclick="window.location.reload()">Generate New Email</button>
        <h3>Inbox</h3>
        {% if messages %}
            {% for msg in messages %}
                <div style="background:#0f3460; margin:10px; padding:10px; border-radius:5px;">
                    <strong>From:</strong> {{ msg.from }}<br>
                    <strong>Subject:</strong> {{ msg.subject }}<br>
                    <p>{{ msg.body }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p>No messages yet.</p>
        {% endif %}
    </div>

    <script>
        let seconds = {{ expiry }};
        const timerElement = document.getElementById("timer");

        function updateTimer() {
            if (seconds > 0) {
                seconds--;
                timerElement.innerText = seconds;
            }
        }

        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
