
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>10m-mail</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #1e3c72, #2a5298);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            padding-top: 60px;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        .mail-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 50px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-align: center;
            max-width: 600px;
        }

        h1 { font-weight: 600; font-size: 2em; }
        .email, .timer { font-weight: 300; font-size: 1.2em; margin: 10px 0; }
        .button {
            margin-top: 20px; padding: 10px 20px; border: none; border-radius: 30px;
            background: #ffffff22; color: white; font-size: 1em; cursor: pointer;
        }
        .button:hover { background: #ffffff55; }
        .inbox { margin-top: 20px; text-align: left; }
        .message {
            background: rgba(255,255,255,0.15); padding: 10px 15px; border-radius: 8px;
            margin-bottom: 10px; white-space: pre-line;
        }
    </style>
</head>
<body>
    <div class="mail-box">
        <h1>10m-mail is live</h1>
        <p class="email">Email: <strong>{{ email }}</strong></p>
        <p class="timer">Expires in: <span id="countdown">{{ expiry }}</span> seconds</p>
        <button class="button" onclick="location.href='/reset'">Generate New Email</button>
        <div class="inbox" id="inbox">
            <h3>Inbox</h3>
        </div>
    </div>

    <script>
        let seconds = {{ expiry }};
        const countdownEl = document.getElementById("countdown");
        setInterval(() => {
            if (seconds > 0) {
                seconds--;
                countdownEl.textContent = seconds;
            } else {
                location.href = "/reset";
            }
        }, 1000);

        async function loadInbox() {
            const res = await fetch("/inbox");
            const data = await res.json();
            const inbox = document.getElementById("inbox");
            inbox.innerHTML = "<h3>Inbox</h3>";
            if (data.length === 0) {
                inbox.innerHTML += "<p>No messages yet.</p>";
            } else {
                data.forEach(msg => {
                    inbox.innerHTML += '<div class="message">' + msg + '</div>';
                });
            }
        }
        setInterval(loadInbox, 5000);
        loadInbox();
    </script>
</body>
</html>
