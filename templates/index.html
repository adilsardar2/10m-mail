<!DOCTYPE html>
<html>
<head>
    <title>10m-mail is live</title>
    <style>
        body { background-color: #0f2027; color: white; font-family: Arial, sans-serif; text-align: center; padding: 100px; }
        .box { background: #1c1c1c; padding: 20px; border-radius: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="box">
        <h1>10m-mail is live</h1>
        <p>Email: example@10m-mail.com</p>
        <p>Expires in: 600 seconds</p>
        <button>Generate New Email</button>
        <h3>Inbox</h3>
        {% if messages %}
            <ul>
                {% for msg in messages %}
                    <li>{{ msg }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No messages yet.</p>
        {% endif %}
    </div>
</body>
</html>
