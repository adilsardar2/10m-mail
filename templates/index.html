<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>10m-mail is live</title>
</head>
<body style="text-align: center; background: #00ACC1; color: white; font-family: Arial;">
    <h1>10m-mail is live</h1>
    <p>Email: {{ email }}</p>
    <p id="timer">Expires in: 600 seconds</p>
    <button onclick="location.href='/reset'">Refresh</button>

    <script>
        let timeLeft = 600;
        let timer = setInterval(function(){
            if(timeLeft <= 0){
                clearInterval(timer);
                window.location.href = '/reset';
            } else {
                document.getElementById("timer").innerHTML = "Expires in: " + timeLeft + " seconds";
            }
            timeLeft -= 1;
        }, 1000);
    </script>
</body>
</html>
